<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Formulario y Captura de Datos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado Principal -->
  <header class="app-header">
    <div class="header-left">
      <button id="btnHome" class="btn-icon" title="Inicio / Lista de Formularios">🏠</button>
      <h1 id="topTitle">Formularios</h1>
    </div>
    <div class="header-right">
      <span id="multiplicadorLabel" class="pill-badge" style="display:none;">x1</span>
      <span id="statusPill" class="pill-badge status-offline">Sin conexión</span>
    </div>
  </header>

  <!-- Contenedor Principal de la App -->
  <main class="app-container">

    <!-- VISTA 1: HOME (Lista de Formularios) -->
    <section id="viewHome" class="view active">
      <div class="view-header">
        <h2>Formularios Disponibles</h2>
        <button id="btnNewForm" class="btn btn-primary">+ Crear Formulario</button>
      </div>

      <div id="formsList" class="forms-grid">
        <!-- Los formularios se renderizan dinámicamente -->
      </div>

      <!-- Ticker / Banner de Registro de Estado -->
      <div class="ticker-box">
        <span class="ticker-title">Estado de Sincronización:</span>
        <span id="tickerText">Cargando registros...</span>
        <button id="btnSyncNow" class="btn btn-ghost btn-sm">Sincronizar Ahora</button>
      </div>
    </section>

    <!-- VISTA 2: FORMULARIO ACTIVO -->
    <section id="viewForm" class="view">
      <div class="form-actions-top">
        <button id="btnBackHome" class="btn btn-ghost">← Volver</button>
        <button id="btnMultiply" class="btn btn-secondary">⚡ Repetir / Multiplicar</button>
      </div>

      <form id="dynamicForm" onsubmit="return false;">
        <div id="questionsContainer">
          <!-- Los campos del formulario se renderizan aquí -->
        </div>

        <div class="form-actions-bottom">
          <button type="button" id="btnCancelForm" class="btn btn-danger">Cancelar</button>
          <button type="button" id="btnSubmitForm" class="btn btn-success">Guardar Respuesta</button>
        </div>
      </form>
    </section>

  </main>

  <!-- MODAL: MULTIPLICADOR DE REPETICIONES -->
  <div id="multiplicarModal" class="modal-overlay">
    <div class="modal-card">
      <h3>Multiplicar Entrada</h3>
      <p>Define cuántas veces se repetirá este registro con los mismos datos base:</p>
      <div class="input-group">
        <input type="number" id="inputMultiplicador" min="1" max="100" value="1">
      </div>
      <div class="modal-actions">
        <button id="btnCancelMultiply" class="btn btn-ghost">Cancelar</button>
        <button id="btnApplyMultiply" class="btn btn-primary">Aplicar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: BUILDER / EDITOR DE FORMULARIOS -->
  <div id="builderModal" class="modal-overlay">
    <div class="modal-card modal-xl">
      <div class="modal-header">
        <h2>Editor de Formulario</h2>
        <button id="btnCloseBuilder" class="btn-icon">✕</button>
      </div>

      <div class="modal-body">
        <!-- Configuración General del Formulario -->
        <div class="builder-general">
          <div class="input-field">
            <label for="bf_name">Nombre del Formulario</label>
            <input type="text" id="bf_name" placeholder="Ej: Inspección de Soldadura">
          </div>
          <div class="input-field">
            <label for="bf_url">URL del WebApp (Google Apps Script)</label>
            <div class="input-with-btn">
              <input type="text" id="bf_url" placeholder="https://script.google.com/macros/s/.../exec">
              <button id="btnTestUrl" class="btn btn-secondary">Probar</button>
            </div>
          </div>
          <div class="input-field">
            <label for="bf_sheet">Nombre de la Hoja en Google Sheet</label>
            <input type="text" id="bf_sheet" placeholder="Ej: Respuestas">
          </div>
        </div>

        <hr class="divider">

        <!-- Lista de Preguntas -->
        <h3>Preguntas del Formulario</h3>
        <div id="builderList" class="questions-builder-list">
          <!-- Preguntas dinámicas -->
        </div>

        <button id="btnAddQuestion" class="btn btn-dashed">+ Agregar Pregunta</button>
      </div>

      <div class="modal-footer">
        <button id="btnSaveBuilder" class="btn btn-success">Guardar Formulario</button>
      </div>
    </div>
  </div>

  <!-- CONTENEDOR DE NOTIFICACIONES TOAST -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- ARCHIVO DE LÓGICA PRINCIPAL -->
  <script src="app.js"></script>
</body>
</html>
